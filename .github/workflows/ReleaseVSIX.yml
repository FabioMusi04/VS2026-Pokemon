name: Release VSIX

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish VSIX
    runs-on: windows-latest

    env:
      Configuration: Release
      Solution: VisualStudioPokemon.slnx
      VsixManifestPath: VisualStudioPokemon\source.extension.vsixmanifest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"

          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            Write-Error "Invalid tag: $tag. Expected vMAJOR.MINOR.PATCH"
            exit 1
          }

          $version = $Matches[1]

          Write-Host "Release version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set VSIX version
        shell: pwsh
        run: |
          $manifest = "${{ env.VsixManifestPath }}"
          $version = "${{ steps.version.outputs.version }}"

          $content = Get-Content $manifest -Raw

          $content = $content -replace `
            '(<Identity\b[^>]*\bVersion=")[^"]*(")', `
            "`${1}$version`${2}"

          Set-Content `
            -Path $manifest `
            -Value $content `
            -NoNewline

          Write-Host "VSIX version set to $version"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.slnx', '**/*.csproj', '**/packages.lock.json', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: >
          msbuild "${{ env.Solution }}"
          /restore
          /v:minimal

      - name: Build VSIX
        run: >
          msbuild "${{ env.Solution }}"
          /m
          /v:minimal
          /p:Configuration=${{ env.Configuration }}
          /p:DeployExtension=False

      - name: Prepare VSIX for release
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem $env:GITHUB_WORKSPACE `
              -Recurse `
              -File `
              -Filter "*.vsix" |
            Where-Object { $_.FullName -match '\\bin\\Release\\' }
          )

          if ($files.Count -ne 1) {
            Write-Host "VSIX files found:"
            $files.FullName | ForEach-Object { Write-Host $_ }

            Write-Error "Expected exactly one VSIX, found $($files.Count)."
            exit 1
          }

          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE "release"
          New-Item $releaseDirectory -ItemType Directory -Force | Out-Null

          $releaseName = "${{ github.event.repository.name }}-${{ steps.version.outputs.version }}.vsix"
          $destination = Join-Path $releaseDirectory $releaseName

          Copy-Item $files[0].FullName $destination

          Write-Host "Release file: $destination"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.vsix