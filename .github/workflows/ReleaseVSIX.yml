name: Build VSIX

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  actions: write

jobs:
  build:
    name: Build VSIX
    runs-on: windows-latest

    env:
      Configuration: Release
      Solution: VisualStudioPokemon.slnx

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.slnx', '**/*.csproj', '**/packages.lock.json', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: >
          msbuild "${{ env.Solution }}"
          /restore
          /v:minimal

      - name: Build
        run: >
          msbuild "${{ env.Solution }}"
          /m
          /v:minimal
          /p:Configuration=${{ env.Configuration }}
          /p:DeployExtension=False

      - name: Find generated VSIX
        id: vsix
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem $env:GITHUB_WORKSPACE `
              -Recurse `
              -File `
              -Filter "*.vsix" |
            Where-Object { $_.FullName -match '\\bin\\Release\\' }
          )

          if ($files.Count -eq 0) {
            Write-Error "The build did not produce a VSIX file."
            exit 1
          }

          if ($files.Count -gt 1) {
            Write-Host "Multiple VSIX files were found:"
            $files.FullName | ForEach-Object { Write-Host $_ }
            Write-Error "Expected exactly one VSIX file."
            exit 1
          }

          Write-Host "Found VSIX: $($files[0].FullName)"
          "path=$($files[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.run_number }}
          path: ${{ steps.vsix.outputs.path }}
          if-no-files-found: error